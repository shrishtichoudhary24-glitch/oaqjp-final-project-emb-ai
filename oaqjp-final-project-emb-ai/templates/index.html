<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Emotion Detector</h1>
        <p>Enter a statement and the app will detect its emotions.</p>
        <textarea class="form-control mb-3" id="textToAnalyze" rows="3"
                  placeholder="Write your text here..."></textarea>
        <button class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
        <div id="system_response" class="mt-4"></div>
    </div>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
